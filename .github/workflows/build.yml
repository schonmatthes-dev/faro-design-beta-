name: Build Faro Design

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ordner wieder aufbauen
        run: |
          mkdir -p tools src/main/java/de/farodesign src/main/resources/assets/farodesign/lang
          mv -f generate_textures.py tools/ || true
          mv -f *.java src/main/java/de/farodesign/ || true
          mv -f fabric.mod.json src/main/resources/ || true
          mv -f en_us.json de_de.json src/main/resources/assets/farodesign/lang/ || true
          find . -not -path './.git/*' -type f | sort
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Texturen erzeugen
        run: |
          pip install pillow
          python tools/generate_textures.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Jar bauen
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Faro-Design-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
