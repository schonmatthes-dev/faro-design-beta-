name: Build Faro Design

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Projektordner finden
        run: |
          FILE=$(find . -name generate_textures.py -path "*tools*" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "FEHLER: generate_textures.py wurde nicht hochgeladen. Diese Dateien liegen im Repository:"
            find . -not -path './.git/*' -type f | head -60
            exit 1
          fi
          DIR=$(dirname "$(dirname "$FILE")")
          echo "Projektordner: $DIR"
          echo "DIR=$DIR" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Texturen erzeugen
        working-directory: ${{ env.DIR }}
        run: |
          pip install pillow
          python tools/generate_textures.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Jar bauen
        working-directory: ${{ env.DIR }}
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Faro-Design-jar
          path: |
            ${{ env.DIR }}/build/libs/*.jar
            !${{ env.DIR }}/build/libs/*-sources.jar
            
